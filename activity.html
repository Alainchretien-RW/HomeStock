<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HomeStock — Activity</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span>H</span><b>HomeStock</b></div><nav><a href="index.html">▣<span>Dashboard</span></a><a href="inventory.html">⬡<span>Inventory</span></a><a href="rooms.html">⌂<span>Rooms</span></a><a href="categories.html">▤<span>Categories</span></a><a href="reports.html">▥<span>Reports</span></a><a class="active" href="activity.html">◷<span>Activity</span></a></nav><div class="sidebar-account">
<div class="sidebar-account-link" aria-hidden="true">
<span class="sidebar-account-avatar" data-profile-avatar>🙂</span>
<span class="sidebar-account-copy"><strong data-user-name>HomeStock User</strong><span data-user-email>Account</span></span>
</div>
</div>
</aside><main><header><div><h1>Activity</h1><p>Recent changes made by family members</p></div><div class="actions"><button class="avatar profile-header-button" type="button" data-profile-toggle title="Open profile" aria-expanded="false"><span data-profile-avatar>🙂</span></button></div></header><section class="panel"><div id="activityList">Loading activity…</div></section></main></div><script src="js/supabase-config.js"></script><script src="js/online.js"></script><script src="js/profile-menu.js"></script>
<script src="js/auth.js"></script><script>
(async()=>{const box=document.querySelector('#activityList');if(!window.HomeStockOnline?.enabled){box.textContent='Connect Supabase to view online activity.';return;}try{const s=await HomeStockOnline.session();const p=await HomeStockOnline.getProfile(s.id);const u=localStorage.getItem('homestock-access-token');const r=await fetch(`${HOMESTOCK_SUPABASE_URL}/rest/v1/activity_log?household_id=eq.${p.household_id}&select=*&order=created_at.desc&limit=50`,{headers:{apikey:HOMESTOCK_SUPABASE_ANON_KEY,Authorization:`Bearer ${u}`}});const rows=await r.json();box.innerHTML=rows.length?rows.map(x=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><b>${x.action}</b> ${x.entity_type}: ${x.entity_name}<div style="font-size:12px;opacity:.65">${new Date(x.created_at).toLocaleString()}</div></div>`).join(''):'No activity yet.';}catch(e){box.textContent='Unable to load activity.';}})();</script></body></html>
