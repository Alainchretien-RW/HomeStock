<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeStock — Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b0f14; }
        .auth-card { width: min(440px, 100%); background: #121821; border: 1px solid #25303d; border-radius: 20px; padding: 36px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
        .auth-brand { display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:28px; }
        .auth-brand span { width:42px; height:42px; display:grid; place-items:center; border-radius:12px; background:#25d0c7; color:#081013; font-weight:800; font-size:20px; }
        .auth-brand b { font-size:22px; }
        .auth-card h1 { text-align:center; margin:0 0 8px; }
        .auth-subtitle { text-align:center; color:#8d99a8; margin:0 0 26px; }
        .auth-form label { display:block; margin:16px 0 8px; font-weight:600; }
        .auth-form input { width:100%; box-sizing:border-box; padding:13px 14px; border:1px solid #303b49; border-radius:10px; background:#0d131b; color:#fff; outline:none; }
        .auth-form input:focus { border-color:#25d0c7; }
        .auth-submit { width:100%; margin-top:22px; }
        .auth-error { background:#3a1f25; border:1px solid #6b303b; color:#ffb8c0; padding:12px 14px; border-radius:10px; margin-bottom:14px; }
        .auth-footer { text-align:center; margin-top:22px; color:#8d99a8; }
        .auth-footer a { color:#25d0c7; text-decoration:none; font-weight:600; }
    .auth-success { background:#16342f; border:1px solid #2a665c; color:#a9eee4; padding:12px 14px; border-radius:10px; margin-bottom:14px; }
    </style>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand"><span>H</span><b>HomeStock</b></div>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to manage your home inventory.</p>
        <div class="auth-success" id="authSuccess" hidden></div>
        <div class="auth-error" id="authError" hidden></div>
        <form class="auth-form" id="loginForm">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="family@example.com" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="btn primary auth-submit" type="submit">Log in</button>
        </form>
        <div class="auth-footer">Don't have an account?<a href="/register">Create one</a></div>
    </main>
    <script src="js/supabase-config.js"></script>
    <script src="js/online.js"></script>
    <script src="js/status.js"></script>
    <script src="js/profile-menu.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
